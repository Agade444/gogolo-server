<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Go Go Lo</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: white;
}

#homePage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.center {
  text-align: center;
  width: 100%;
}

.logo {
  font-size: 75px;
  font-weight: bold;
  margin-bottom: 30px;
}

.blue { color: #4285f4; }
.red { color: #ea4335; }
.yellow { color: #fbbc05; }
.green { color: #34a853; }

.mainSearch {
  width: min(600px, 80%);
  height: 55px;
  border: 1px solid #ddd;
  border-radius: 30px;
  padding: 0 25px;
  font-size: 18px;
  outline: none;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.mainSearch:focus {
  box-shadow: 0 3px 12px rgba(0,0,0,.22);
}

.homeButtons {
  margin-top: 25px;
}

.searchButton,
.aiBig {
  border: none;
  border-radius: 9px;
  padding: 13px 22px;
  font-size: 16px;
  cursor: pointer;
  margin: 4px;
}

.searchButton:hover {
  background: #e8e8e8;
}

.aiBig {
  background: #111;
  color: white;
}

.aiBig:hover {
  background: #333;
}


/* =========================
   AI PENCERESİ
========================= */

#aiBox {
  display: none;
  position: fixed;
  inset: 20px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 5px 35px rgba(0,0,0,.28);
  overflow: hidden;
  z-index: 1000;
}

.aiLayout {
  height: 100%;
  display: flex;
}


/* SOL SOHBET LİSTESİ */

.aiSidebar {
  width: 260px;
  background: #171717;
  color: white;
  display: flex;
  flex-direction: column;
}

.aiSidebarTitle {
  padding: 20px;
  font-size: 19px;
  font-weight: bold;
}

.newChat {
  margin: 0 12px 14px;
  padding: 12px;
  border: 1px solid #555;
  border-radius: 10px;
  background: transparent;
  color: white;
  cursor: pointer;
  font-size: 15px;
}

.newChat:hover {
  background: #2b2b2b;
}

.chatList {
  flex: 1;
  overflow-y: auto;
  padding: 5px 8px 15px;
}

.chatItem {
  display: flex;
  align-items: center;
  border-radius: 9px;
  margin-bottom: 5px;
}

.chatItem:hover {
  background: #2b2b2b;
}

.chatItem.active {
  background: #343434;
}

.chatTitle {
  flex: 1;
  padding: 11px;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 14px;
}

.deleteChat {
  border: none;
  background: transparent;
  color: #aaa;
  cursor: pointer;
  padding: 8px;
}

.deleteChat:hover {
  color: #ff6b6b;
}


/* SAĞ AI ALANI */

.aiMain {
  flex: 1;
  min-width: 0;
  position: relative;
  display: flex;
  flex-direction: column;
}

.aiHeader {
  height: 62px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  background: #111;
  color: white;
  font-weight: bold;
}

.close {
  cursor: pointer;
  font-size: 28px;
}

.aiContent {
  flex: 1;
  padding: 25px;
  overflow-y: auto;
  line-height: 1.55;
  background: #fff;
}

.welcome {
  max-width: 600px;
  margin: 80px auto;
  text-align: center;
  color: #555;
}

.welcomeIcon {
  font-size: 55px;
  margin-bottom: 15px;
}

.userMessage,
.aiMessage {
  max-width: 750px;
  padding: 13px 16px;
  border-radius: 16px;
  margin: 12px auto;
}

.userMessage {
  background: #f1f3f4;
}

.aiMessage {
  background: #eef4ff;
}

.aiInputArea {
  flex-shrink: 0;
  padding: 15px 20px 20px;
  background: white;
  border-top: 1px solid #eee;
}

.aiInput {
  max-width: 800px;
  margin: auto;
  display: flex;
  gap: 8px;
}

.aiInput input {
  flex: 1;
  height: 48px;
  border-radius: 25px;
  border: 1px solid #ccc;
  padding: 0 18px;
  outline: none;
  font-size: 15px;
}

.aiInput button {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #111;
  color: white;
  cursor: pointer;
  font-size: 18px;
}

.aiStatus {
  text-align: center;
  font-size: 12px;
  color: #888;
  margin-top: 8px;
}


/* TELEFON */

@media (max-width: 700px) {

  #aiBox {
    inset: 0;
    border-radius: 0;
  }

  .aiSidebar {
    width: 150px;
  }

  .logo {
    font-size: 55px;
  }

}

</style>
</head>


<body>

<div id="homePage">

  <div class="center">

    <div class="logo">
      <span class="blue">G</span>
      <span class="red">o</span>
      <span class="yellow">G</span>
      <span class="blue">o</span>
      <span class="green">L</span>
      <span class="red">o</span>
    </div>

    <input
      id="mainSearch"
      class="mainSearch"
      placeholder="Go Go Lo'da ara..."
    >

    <div class="homeButtons">

      <button
        class="searchButton"
        onclick="searchGoogle()"
      >
        🔎 Go Go Lo'da Ara
      </button>

      <button
        class="aiBig"
        onclick="openAI()"
      >
        ✨ Go Go Lo AI
      </button>

      <button
        class="aiBig"
        onclick="window.location.href='/mail'"
      >
        📨 Go Go Lo Mail
      </button>

    </div>

  </div>

</div>


<!-- AI -->

<div id="aiBox">

  <div class="aiLayout">

    <aside class="aiSidebar">

      <div class="aiSidebarTitle">
        🧠 Go Go Lo AI
      </div>

      <button
        class="newChat"
        onclick="createNewChat()"
      >
        ＋ Yeni Sohbet
      </button>

      <div
        id="chatList"
        class="chatList"
      >
      </div>

    </aside>


    <section class="aiMain">

      <div class="aiHeader">

        <span id="currentChatTitle">
          ✨ Go Go Lo AI
        </span>

        <span
          class="close"
          onclick="closeAI()"
        >
          ×
        </span>

      </div>


      <div
        id="aiContent"
        class="aiContent"
      >

        <div class="welcome">

          <div class="welcomeIcon">
            🤖
          </div>

          <h2>
            Go Go Lo AI
          </h2>

          <p>
            Bir sohbet seç veya yeni sohbet başlat.
          </p>

        </div>

      </div>


      <div class="aiInputArea">

        <div class="aiInput">

          <input
            id="aiQuestion"
            placeholder="Go Go Lo AI'ye sor..."
          >

          <button onclick="sendAI()">
            ➤
          </button>

        </div>

        <div
          id="aiStatus"
          class="aiStatus"
        >
          Sohbetler Go Go Lo hesabına kaydedilir.
        </div>

      </div>

    </section>

  </div>

</div>


<script>

const mainInput =
  document.getElementById("mainSearch");

const aiInput =
  document.getElementById("aiQuestion");

const content =
  document.getElementById("aiContent");

const chatList =
  document.getElementById("chatList");

const currentChatTitle =
  document.getElementById("currentChatTitle");

const aiStatus =
  document.getElementById("aiStatus");


let currentChatId = null;

let currentMessages = [];

let sending = false;


/* =========================================
   GOOGLE ARAMA
========================================= */

function searchGoogle() {

  const text =
    mainInput.value.trim();

  if (!text) return;

  window.open(
    "https://www.google.com/search?q=" +
    encodeURIComponent(text),
    "_blank"
  );
}


/* =========================================
   HTML GÜVENLİĞİ
========================================= */

function escapeHTML(text) {

  return String(text)

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================
   AI AÇ / KAPAT
========================================= */

async function openAI() {

  document.getElementById("aiBox")
    .style.display = "block";

  await loadChats();

  aiInput.focus();
}


function closeAI() {

  document.getElementById("aiBox")
    .style.display = "none";
}


/* =========================================
   SOHBETLERİ GETİR
========================================= */

async function loadChats() {

  try {

    const response =
      await fetch("/api/ai/chats");

    if (response.status === 401) {

      showLoginMessage();
      return;
    }

    const data =
      await response.json();

    if (!data.ok) {
      return;
    }

    renderChatList(data.chats);

    if (
      !currentChatId &&
      data.chats.length > 0
    ) {

      await openChat(
        data.chats[0].id
      );
    }

  }

  catch(error) {

    console.error(error);

    aiStatus.textContent =
      "Sohbetler yüklenemedi.";
  }
}


/* =========================================
   SOHBET LİSTESİNİ ÇİZ
========================================= */

function renderChatList(chats) {

  chatList.innerHTML = "";

  if (!chats.length) {

    chatList.innerHTML =
      '<div style="padding:15px;color:#999;font-size:13px;">Henüz sohbet yok.</div>';

    return;
  }


  chats.forEach(chat => {

    const item =
      document.createElement("div");

    item.className =
      "chatItem" +
      (
        chat.id === currentChatId
          ? " active"
          : ""
      );


    const title =
      document.createElement("div");

    title.className =
      "chatTitle";

    title.textContent =
      chat.title;

    title.onclick =
      () => openChat(chat.id);


    const del =
      document.createElement("button");

    del.className =
      "deleteChat";

    del.textContent =
      "🗑";

    del.title =
      "Sohbeti sil";

    del.onclick =
      event => {

        event.stopPropagation();

        deleteChat(
          chat.id,
          chat.title
        );
      };


    item.appendChild(title);
    item.appendChild(del);

    chatList.appendChild(item);
  });
}


/* =========================================
   YENİ SOHBET
========================================= */

async function createNewChat() {

  try {

    const response =
      await fetch(
        "/api/ai/chats",
        {
          method: "POST"
        }
      );


    if (response.status === 401) {

      showLoginMessage();
      return;
    }


    const data =
      await response.json();


    if (!data.ok) {
      return;
    }


    currentChatId =
      data.chat.id;

    currentMessages = [];


    currentChatTitle.textContent =
      "✨ Yeni Sohbet";


    renderMessages();


    await loadChats();


    aiInput.focus();

  }

  catch(error) {

    console.error(error);
  }
}


/* =========================================
   ESKİ SOHBETİ AÇ
========================================= */

async function openChat(id) {

  try {

    const response =
      await fetch(
        "/api/ai/chats/" +
        encodeURIComponent(id)
      );


    if (response.status === 401) {

      showLoginMessage();
      return;
    }


    const data =
      await response.json();


    if (!data.ok) {
      return;
    }


    currentChatId =
      data.chat.id;


    currentMessages =
      data.chat.messages || [];


    currentChatTitle.textContent =
      "✨ " + data.chat.title;


    renderMessages();


    await refreshChatList();


    aiInput.focus();

  }

  catch(error) {

    console.error(error);
  }
}


/* =========================================
   SADECE SOHBET LİSTESİNİ YENİLE
========================================= */

async function refreshChatList() {

  try {

    const response =
      await fetch("/api/ai/chats");

    const data =
      await response.json();

    if (data.ok) {
      renderChatList(data.chats);
    }

  }

  catch(error) {
    console.error(error);
  }
}


/* =========================================
   MESAJLARI ÇİZ
========================================= */

function renderMessages() {

  content.innerHTML = "";


  if (!currentMessages.length) {

    content.innerHTML = `

      <div class="welcome">

        <div class="welcomeIcon">
          🤖
        </div>

        <h2>
          Yeni sohbet
        </h2>

        <p>
          Bana istediğin şeyi sor! 😎
        </p>

      </div>

    `;

    return;
  }


  currentMessages.forEach(
    message => {

      if (
        message.role === "user"
      ) {

        content.innerHTML +=

          '<div class="userMessage">' +

          '<b>Sen:</b><br>' +

          escapeHTML(message.text)
            .replace(/\n/g, "<br>") +

          '</div>';

      }

      else {

        content.innerHTML +=

          '<div class="aiMessage">' +

          '🤖 <b>Go Go Lo AI:</b><br>' +

          escapeHTML(message.text)
            .replace(/\n/g, "<br>") +

          '</div>';
      }
    }
  );


  content.scrollTop =
    content.scrollHeight;
}


/* =========================================
   MESAJI SUNUCUYA KAYDET
========================================= */

async function saveMessage(
  role,
  text
) {

  const response =
    await fetch(

      "/api/ai/chats/" +
      encodeURIComponent(
        currentChatId
      ) +
      "/messages",

      {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            role,
            text
          })

      }
    );


  const data =
    await response.json();


  if (!data.ok) {

    throw new Error(
      data.error ||
      "Mesaj kaydedilemedi."
    );
  }


  return data;
}


/* =========================================
   AI'YA MESAJ GÖNDER
========================================= */

async function sendAI() {

  if (sending) {
    return;
  }


  const question =
    aiInput.value.trim();


  if (!question) {
    return;
  }


  // "Bunu hatırla" komutunu kontrol et

  const rememberMatch =
    question.match(
      /^(?:bunu\s+)?hatırla\s*[:,-]?\s*(.+)$/i
    );


  if (rememberMatch) {

    const memoryText =
      rememberMatch[1].trim();

    try {

      const memoryResponse =
        await fetch(
          "/api/ai/memory",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                text: memoryText
              })
          }
        );


      const memoryData =
        await memoryResponse.json();


      if (memoryData.ok) {

        content.innerHTML +=
          '<div class="aiMessage">' +
          '🧠 <b>Go Go Lo AI:</b><br>' +
          'Bunu hatırlayacağım: ' +
          escapeHTML(memoryText) +
          '</div>';

        content.scrollTop =
          content.scrollHeight;
      }

    }

    catch(error) {

      console.error(
        "Hafızaya kaydedilemedi:",
        error
      );
    }
  }


  /*
    Henüz sohbet yoksa
    otomatik oluştur.
  */

  if (!currentChatId) {

    await createNewChat();

    if (!currentChatId) {
      return;
    }
  }


  sending = true;

  aiInput.value = "";

  aiInput.disabled = true;


  try {

    /*
      Önce kullanıcının mesajını
      Go Go Lo sunucusuna kaydet.
    */

    const saved =
      await saveMessage(
        "user",
        question
      );


    currentMessages.push({

      role: "user",

      text: question

    });


    currentChatTitle.textContent =
      "✨ " +
      saved.chatTitle;


    renderMessages();


    /*
      Düşünüyorum kutusu
    */

    const thinkingID =
      "thinking-" +
      Date.now();


    content.innerHTML +=

      '<div class="aiMessage" id="' +
      thinkingID +
      '">' +

      '🤖 <b>Go Go Lo AI:</b><br>' +

      'Düşünüyorum... ✨' +

      '</div>';


    content.scrollTop =
      content.scrollHeight;


    /*
      GENEL HAFIZAYI AL
    */

    let generalMemory = "";


    try {

      const memoryResponse =
        await fetch(
          "/api/ai/context"
        );


      if (
        memoryResponse.ok
      ) {

        const memoryData =
          await memoryResponse.json();


        generalMemory =
          memoryData.memoryText ||
          "";
      }

    }

    catch(error) {

      console.error(
        "Hafıza alınamadı:",
        error
      );
    }


    /*
      ESKİ MESAJLARIN TAMAMINI
      AI'YA GÖNDER
    */

    const geminiContents = [];


    currentMessages.forEach(
      message => {

        geminiContents.push({

          role:
            message.role === "model"
              ? "model"
              : "user",

          parts: [
            {
              text:
                message.text
            }
          ]

        });

      }
    );


    /*
      GO GO LO AI KİŞİLİĞİ
      + GENEL HAFIZA
    */

    if (
      geminiContents.length > 0
    ) {

      geminiContents[0]
        .parts[0]
        .text =

        "Bu kullanıcı hakkında önceki sohbetlerden hatırladığın bilgiler şunlardır:\n" +

        (
          generalMemory ||
          "Henüz kayıtlı genel hafıza yok."
        ) +

        "\n\n" +

        "Senin adın Go Go Lo AI. " +

        "Kullanıcıyla Türkçe konuş. " +

        "Samimi, anlaşılır ve yardımcı cevap ver. " +

        "Bu konuşmanın önceki mesajlarını hatırla ve " +

        "gerektiğinde onlara göre cevap ver.\n\n" +

        geminiContents[0]
          .parts[0]
          .text;
    }


    /*
      GEMINI'YE ARTIK
      TARAYICIDAN DEĞİL,
      GO GO LO SUNUCUSUNDAN
      BAĞLANIYORUZ.
    */

    const response =
      await fetch(
        "/api/ai/generate",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              contents:
                geminiContents
            })
        }
      );


    const serverResult =
      await response.json();


    const data =
      response.ok
        ? serverResult.data
        : {
            error: {
              message:
                serverResult.error ||
                "Go Go Lo AI bağlantı hatası."
            }
          };


    const thinking =
      document.getElementById(
        thinkingID
      );


    if (!response.ok) {

      const errorMessage =
        data?.error?.message ||
        "AI bağlantı hatası.";


      thinking.innerHTML =

        "⚠️ <b>Go Go Lo AI:</b><br>" +

        escapeHTML(
          errorMessage
        );


      return;
    }


    const answer =

      data?.candidates?.[0]
        ?.content
        ?.parts
        ?.map(
          part =>
            part.text || ""
        )
        .join("") ||

      "Şu anda cevap oluşturamadım.";


    /*
      AI cevabını da
      sunucuya kaydet.
    */

    await saveMessage(
      "model",
      answer
    );


    currentMessages.push({

      role: "model",

      text: answer

    });


    renderMessages();


    await refreshChatList();

  }

  catch(error) {

    console.error(error);


    content.innerHTML +=

      '<div class="aiMessage">' +

      '⚠️ <b>Go Go Lo AI:</b><br>' +

      escapeHTML(
        error.message
      ) +

      '</div>';

  }

  finally {

    sending = false;

    aiInput.disabled = false;

    aiInput.focus();
  }
}


/* =========================================
   SOHBET SİL
========================================= */

async function deleteChat(
  id,
  title
) {

  const sure =
    confirm(
      '"' +
      title +
      '" sohbetini silmek istiyor musun?'
    );


  if (!sure) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/ai/chats/" +
        encodeURIComponent(id),
        {
          method: "DELETE"
        }
      );


    const data =
      await response.json();


    if (!data.ok) {
      return;
    }


    if (
      currentChatId === id
    ) {

      currentChatId = null;

      currentMessages = [];

      currentChatTitle.textContent =
        "✨ Go Go Lo AI";

      renderMessages();
    }


    await loadChats();

  }

  catch(error) {

    console.error(error);
  }
}


/* =========================================
   GİRİŞ YAPILMAMIŞSA
========================================= */

function showLoginMessage() {

  currentChatId = null;

  currentMessages = [];


  chatList.innerHTML = "";


  content.innerHTML = `

    <div class="welcome">

      <div class="welcomeIcon">
        🔐
      </div>

      <h2>
        Go Go Lo hesabına giriş yap
      </h2>

      <p>
        Sohbetlerini kaydedebilmek ve
        eski konuşmalarına ulaşabilmek için
        önce hesabına giriş yapmalısın.
      </p>

      <button
        onclick="window.location.href='/login'"
        style="
          border:none;
          background:#111;
          color:white;
          padding:12px 20px;
          border-radius:10px;
          cursor:pointer;
        "
      >
        🔐 Giriş Yap
      </button>

    </div>

  `;


  aiStatus.textContent =
    "Sohbet hafızası için giriş gerekli.";
}


/* =========================================
   ENTER
========================================= */

mainInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      searchGoogle();
    }
  }
);


aiInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      sendAI();
    }
  }
);

</script>

</body>
</html>
